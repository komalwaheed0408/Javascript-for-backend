🧠 Important DOM Concepts From This
document is the root.
html is the main element.
head and body are children of html.
h1 has:
a text node
a span child
The <span> text is hidden because of display: none, but it still exists in the DOM.
The <ul> contains 4 <li> elements as children. -->
