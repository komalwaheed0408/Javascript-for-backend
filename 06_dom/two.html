<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM---more....</title>
</head>
<body style="background-color: #212121; color: #fff">    
    <div class="parent"> 
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>    
</body>

<script>
    const parent = document.querySelector('.parent')
    console.log(parent); //this will show u all the divs in parent in the console browser

    //we also have a property that we can use for class called: children
    console.log(parent.children); //u can check in console (in browser), it returns an HTML collection which is like an array but not an array itself
    console.log(parent.children[1].innerHTMl)

    //we can also apply loop on this class parent and print the elements. But I guess, we will have to convert HTML collection to an array then only it is possible 
    //But we can use the normal for let loop on it, becuase being array doesn't matter for it:
    for(let i = 0; i < parent.children.length; i++){
        console.log(parent.children[i].innerHTMl);
    }

    parent.children[1].style.color = "orange";
    console.log(parent.firstElementChild); //firstElementChild → returns the first child element (ignores text/comments) of a parent.
    console.log(parent.lastElementChild); //lastElementChild → returns the last child element (ignores text/comments) of a parent.
   

    const dayOne = document.querySelector('.day'); //will give u first one from the list so it gives Monday
    console.log(dayOne);

    console.log(dayOne.parentElement); //Now, we are accessing parent through a child.  //hence, gives parent div
    console.log(dayOne.nextElementSibling); //Now, we access the element next to the dayOne's element //hence, gives Tuesday

    console.log("NODES: ", parent.childNodes); //this returns a nodelist with all the children of it
   
</script>
</html>
