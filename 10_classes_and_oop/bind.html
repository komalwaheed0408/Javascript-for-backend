<body>
    <button>Button Clicked</button>
</body>

<script> 
    class React 
     {
            contructor ()
            {
                this.library  = "React"
                this.server = "https://localhost:300"

                document
                .querySelector('button')
                .addEventListener('click', this.handleClick).
                bind(this)    //bind givs acess of everything in this constructor
                //In JavaScript, .bind() creates a new function where this is permanently set to the value you give it.
            }
        
        handleClick()
        {
            console.log("button clicked");
            console.log(this);
        }
    }
    const app = new React()
</script>
